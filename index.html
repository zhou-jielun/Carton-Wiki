      ];
    }
  }
  
  // 小白老板的回复
  if (simState.customerRole.indexOf('小白老板') !== -1) {
    if (phase === 'greeting') {
      replies = [
        '你好，我听说你们是做纸箱机械的。这个机器好用吗？',
        '我们工厂想买台新机器，但我对这个不太懂。你能简单介绍一下吗？',
        '朋友推荐我联系你们。你们机器贵不贵啊？'
      ];
    } else if (phase === 'intro') {
      replies = [
        '听起来不错。这个机器需要几个人操作啊？我们工人文化程度不高。',
        '维修麻烦吗？我们这边没有专业维修人员。',
        '机器耗电量大吗？我们这边电费挺贵的。'
      ];
    } else if (phase === 'qa') {
      replies = [
        '保修多久啊？坏了怎么办？',
        '你们能派人来教我们怎么用吗？',
        '机器容易坏吗？我们用不了太复杂的东西。'
      ];
    } else if (phase === 'quote') {
      replies = [
        '价格有点贵啊。能不能便宜点？我们预算有限。',

        '能不能用分期付款？我们一下子拿不出这么多钱。'
      ];
    } else if (phase === 'negotiation') {
      replies = [
        '好吧，价格就按你们说的。什么时候能发货？',
        '合同我看了，没什么问题。什么时候签合同？',
        '我们先订一台，用得好再订第二台。可以吧？'
      ];
    }
  }
  
  // 技术工程师的回复（难度更高）
  if (simState.customerRole.indexOf('技术工程师') !== -1) {
    if (phase === 'greeting') {
      replies = [
        '你好。我看了你们的技术资料。有几个问题想确认一下。',
        '我们是技术部门。想了解一下你们机器的控制系统是用什么的？',
        '你们机器的最高印刷速度是多少？在实际生产中能稳定达到吗？'

    } else if (phase === 'intro') {

      ];
    } else if (phase === 'negotiation') {
      replies = [
        '技术条款我们可以接受。但付款方式要改成：预付30%，发货前付60%，验收后付10%。',

      ];
    }
  }
  
  // 决策老板的回复
  if (simState.customerRole.indexOf('决策老板') !== -1) {
    if (phase === 'greeting') {
      replies = [
        '你好。我们公司正在扩大产能，需要增加生产线。你们有什么推荐？',
        '我是公司的老板。我想了解一下你们设备的投资回报情况。',
        '我们打算投资一条新的纸箱生产线。你们能做整线方案吗？'
      ];
    } else if (phase === 'intro') {
      replies = [
        '投资回报期多长？我们算了一下，大概需要2年才能回本。',
        '你们和其他品牌比，优势在哪里？为什么我们要选你们而不是德国机器？',
        '你们公司做了多久了？有没有可能做不下去，我们的保修就没了？'
      ];
    } else if (phase === 'qa') {
      replies = [
        '保修期外的维修费用高吗？你们配件价格怎么样？',
        '如果机器出现问题，影响生产，你们怎么赔偿？',
        '你们能提供金融方案吗？我们可以接受融资租赁。'
      ];
    } else if (phase === 'quote') {
      replies = [
        '报价我看了。总投资要50万美元，有点高。能不能降到45万？',
        '这个报价是FOB价还是CIF价？运费和保险费谁出？',
        '如果一次性订整条生产线，能给多少折扣？'
      ];

      replies = [
        '好吧，就按45万美元。但你们要承诺18个月内回本，否则要补偿。',

        '可以。什么时候能开始执行合同？我们要尽快投产。'
      ];
    }
  }
  
  // 根据难度级别调整回复（困难模式下，客户会更挑剔）
  if (simState.difficulty === '困难') {
    // 有30%概率客户会提出额外要求或质疑
    if (Math.random() < 0.3) {
      replies.push('这个我还是不太满意。你们能不能再改进一下方案？');

    }

  // 过滤掉已讨论过的话题（避免重复）
  var filteredReplies = [];
  for (var i = 0; i < replies.length; i++) {
    var reply = replies[i];
    var isDuplicate = false;
    for (var j = 0; j < simState.askedQuestions.length; j++) {
      if (reply.indexOf(simState.askedQuestions[j]) !== -1) {

        break;

    if (!isDuplicate) {
      filteredReplies.push(reply);
    }
  }
  
  // 如果过滤后没有回复了，就使用原始回复列表
  if (filteredReplies.length === 0) {
    filteredReplies = replies;
  }
  
  // 随机选择一条回复
  var selectedReply = filteredReplies[Math.floor(Math.random() * filteredReplies.length)];
  
  // 将讨论的话题添加到 askedQuestions
  // 简单提取关键词（取回复的前20个字符作为话题标识）
  var topic = selectedReply.substring(0, 20);
  simState.askedQuestions.push(topic);
  
  return selectedReply;
}

function simAddMsg(who, text) {
  var body = document.getElementById('sim-chat-body');
  if (!body) return;
  var now = new Date();
  var timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  var div = document.createElement('div');
  div.className = 'sim-msg sim-msg-' + who;
  div.innerHTML = '<div class="sim-msg-bubble">' + text + '</div><div class="sim-msg-time">' + timeStr + '</div>';
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
  simState.messages.push({ who: who, text: text, time: now.toISOString() });
}

function simSend() {
  var input = document.getElementById('sim-input');
  var text = input.value.trim();
  if (!text) return;
  simAddMsg('user', text);
  input.value = '';
  input.style.height = 'auto';

  // 更新分数（简单关键词检测）
  simScore(text);

  // 模拟打字效果
  var body = document.getElementById('sim-chat-body');
  var typing = document.createElement('div');
  typing.className = 'sim-msg sim-msg-cust';
  typing.id = 'sim-typing';
  typing.innerHTML = '<div class="sim-msg-bubble" style="opacity:0.5;">正在输入...</div>';
  body.appendChild(typing);
  body.scrollTop = body.scrollHeight;

  setTimeout(function() {
    var el = document.getElementById('sim-typing');
    if (el) el.remove();
    var phaseNames = ['greeting','intro','qa','quote','negotiation'];
    var nextPhase = simState.phase < 4 ? phaseNames[simState.phase + 1] : phaseNames[4];
    // 有30%概率推进阶段
    if (Math.random() < 0.3 && simState.phase < 4) {
      simState.phase++;
      simUpdateDots();
    }
    var reply = simGenReply(nextPhase);
    simAddMsg('cust', reply);
  }, 1000 + Math.random() * 2000);
}

function simScore(text) {
  var t = text.toLowerCase();
  // 专业性：提到技术参数、公司优势
  if (t.match(/speed|precision|accuracy|efficiency|warranty|experience|year|iso|ce/)) simState.scores.professional += 1;
  // 响应性：回复长度适中
  if (text.length > 20 && text.length < 500) simState.scores.responsiveness += 1;
  // 产品知识
  if (t.match(/flexo|printer|slotter|die.cut|hy-1224|hy-1428|corrugat/)) simState.scores.productKnowledge += 1;
  // 谈判技巧
  if (t.match(/discount|price|delivery|payment|install|training|free|extra/)) simState.scores.negotiation += 1;
}

function simUpdateDots() {
  for (var i = 0; i < simState.phases.length; i++) {
    var dot = document.getElementById('sim-dot-' + i);
    if (dot) dot.classList.toggle('active', i <= simState.phase);
  }
}

  var userMsgs = simState.messages.filter(function(m) { return m.who === 'user'; });
  var lastUserMsg = userMsgs.length > 0 ? userMsgs[userMsgs.length - 1].text : '';

  var html = '<div style="font-size:15px;font-weight:600;margin-bottom:12px;color:var(--apple-blue);">💡 沟通建议（当前阶段：' + currentPhase + '）</div>';
  html += '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:12px;">以下是针对当前沟通阶段的建议：</div>';
  html += '<ul class="sim-summary-list sim-summary-tip" style="margin-bottom:16px;">';
  for (var s = 0; s < suggestions.length; s++) {
    html += '<li>' + suggestions[s] + '</li>';
  }
  html += '</ul>';
  html += '<div style="font-size:13px;font-weight:600;color:var(--apple-green);margin-bottom:8px;">📈 可改进方向</div>';
  html += '<ul class="sim-summary-list sim-summary-tip">';
  for (var i = 0; i < improvements.length; i++) {
    html += '<li>' + improvements[i] + '</li>';
  }
  html += '</ul>';

  if (lastUserMsg) {
    html += '<div style="margin-top:16px;padding:12px;background:rgba(0,122,255,0.05);border-radius:10px;font-size:12px;color:var(--text-secondary);">';
    html += '<div style="font-weight:600;margin-bottom:6px;">您上一条回复分析：</div>';
    html += '<div style="line-height:1.6;">';
    if (lastUserMsg.length < 20) html += '⚠️ 回复偏短，可以更安全详细地介绍产品和公司优势。<br>';
    if (!lastUserMsg.match(/\?[？]/)) html += '💡 可以提一个开放式问题，引导客户多说一些需求。<br>';
    if (lastUserMsg.match(/price|discount|cheap/)) html += '✅ 主动讨论价格是好的，但先建立价值再谈价格效果更好。';
    if (!lastUserMsg.match(/[？\?]/) && lastUserMsg.length > 50) html += '👍 回复内容充实，建议加一个问题让对话继续。';
    html += '</div></div>';
  }

  openModal(html);
}

function simEnd() {
  if (!simState) return;
  var duration = Math.round((Date.now() - simState.startTime) / 1000 / 60 * 10) / 10;
  var msgCount = simState.messages.length;
  var userMsgCount = 0;
  
  // 计算用户消息数量
  for (var i = 0; i < simState.messages.length; i++) {
    if (simState.messages[i].who === 'user') userMsgCount++;
  }

  // 生成总结
  var goodPoints = [];
  var badPoints = [];
  var tips = [];

  // 根据分数分析
  if (simState.scores.professional >= 2) {
    goodPoints.push('专业性表现好，能准确提及产品技术参数');
  } else {
    badPoints.push('可以更多地提及产品技术参数和公司优势，建立专业形象');
  }

  } else {
    badPoints.push('建议提前准备好产品资料，更流畅地介绍产品特点');

  if (simState.scores.negotiation >= 1) {

    tips.push('谈判阶段可以主动提出一些flexible的方案，如折扣条件、额外配件等');

  if (simState.phase >= 3) {

        '<div style="font-size:24px;font-weight:700;color:var(--apple-blue);">' + (duration < 1 ? '<1' : duration) + ' 分钟</div>' +
      '</div>' +

      '</div>' +
      '<div style="padding:12px;background:rgba(255,149,0,0.05);border-radius:10px;text-align:center;">' +

}

let _mapChart = null, _mapViewMode = 'count';

function _getMapCustomers() {
  const raw = Storage.getCustomers();
  if (!Array.isArray(raw)) return [];
  return raw.map(c => {
    let createdAt = '';
    if (c.createdAt) {
      try { createdAt = new Date(c.createdAt).toISOString().split('T')[0]; } catch(e) {}
    }
    return {
      name: c.name || c.company || '未知客户',
      country: (c.country || '未知').trim(),
      city: c.city || '',
      contact: c.contact || '',
      stage: c.stage || c.status || '潜在客户',
      source: c.source || '',
      createdAt: createdAt,
      amount: parseFloat(c.amount || c.totalAmount || 0)
    };
  });
}

function _getFilteredCustomers() {
  let customers = _getMapCustomers();
  const timeEl = document.getElementById('map-time-filter');
  const statusEl = document.getElementById('map-status-filter');
  const searchEl = document.getElementById('map-search-input');
  if (!timeEl) return customers;

  const timeFilter = timeEl.value || 'all';
  const statusFilter = statusEl ? (statusEl.value || 'all') : 'all';
  const searchQuery = searchEl ? (searchEl.value || '').trim().toLowerCase() : '';

  const now = new Date();
  if (timeFilter === 'today') {
    const today = now.toISOString().split('T')[0];
    customers = customers.filter(c => c.createdAt >= today);
  } else if (timeFilter === 'week') {
    const d = new Date(now - 7*86400000).toISOString().split('T')[0];
    customers = customers.filter(c => c.createdAt >= d);
  } else if (timeFilter === 'month') {
    const d = new Date(now - 30*86400000).toISOString().split('T')[0];
    customers = customers.filter(c => c.createdAt >= d);
  } else if (timeFilter === 'quarter') {
    const d = new Date(now - 90*86400000).toISOString().split('T')[0];
    customers = customers.filter(c => c.createdAt >= d);
  } else if (timeFilter === 'year') {
    const d = new Date(now - 365*86400000).toISOString().split('T')[0];
    customers = customers.filter(c => c.createdAt >= d);
  }

  if (statusFilter === 'active') { customers = customers.filter(c => c.stage !== '已流失'); }
  else if (statusFilter === 'lost') { customers = customers.filter(c => c.stage === '已流失'); }

  if (searchQuery) {
    customers = customers.filter(c =>
      (c.name || '').toLowerCase().includes(searchQuery) ||
      (c.country || '').toLowerCase().includes(searchQuery) ||
      (c.city || '').toLowerCase().includes(searchQuery) ||
      (c.contact || '').toLowerCase().includes(searchQuery)
    );
  }
  return customers;
}

function _buildCountryMap(customers) {
  const map = {};
  customers.forEach(c => {
    const cn = c.country;
    if (!map[cn]) map[cn] = { count: 0, totalAmount: 0 };
    map[cn].count++;
    map[cn].totalAmount += (c.amount || 0);
  });
  return map;
}

// ==================== ECharts 地图 ====================
function _initEchartsMap(customers, countryMap) {
  const dom = document.getElementById('map-echarts-container');
  if (!dom) return;

  // 销毁旧实例
  if (_mapChart) { _mapChart.dispose(); _mapChart = null; }

  // 检查 ECharts 是否加载
  if (typeof echarts === 'undefined') {
    dom.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-secondary);font-size:13px;">ECharts 加载中...</div>';
    setTimeout(() => _initEchartsMap(customers, countryMap), 500);
    return;
  }

  // 检查世界地图数据是否已注册，未注册则动态加载 world-map-data.js
  if (!echarts.getMap || !echarts.getMap('world')) {
    if (!window._worldMapLoading) {
      window._worldMapLoading = true;
      dom.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-secondary);font-size:13px;">地图数据加载中...</div>';
      var s = document.createElement('script');
      s.src = 'world-map-data.js';
      s.onload = function() { window._worldMapLoading = false; _initEchartsMap(customers, countryMap); };
      s.onerror = function() { window._worldMapLoading = false; dom.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#FF3B30;font-size:13px;">地图数据加载失败，请刷新重试</div>'; };
      document.head.appendChild(s);
    } else {
      dom.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-secondary);font-size:13px;">地图数据加载中...</div>';
      setTimeout(function() { _initEchartsMap(customers, countryMap); }, 300);
    }
    return;
  }

  _mapChart = echarts.init(dom);

  _mapChart.on('click', function(params) {
    if (params.name && _EC_NAME_MAP[params.name]) {
      _selectCountry(_EC_NAME_MAP[params.name]);
    }
  });

  _updateEchartsOption(customers, countryMap);
}

function _updateEchartsOption(customers, countryMap) {
  if (!_mapChart) return;

  const mapData = [];
  let maxVal = 1;
  Object.entries(countryMap).forEach(([cn, d]) => {
    const en = _EC_NAME_REV[cn];
    if (!en) return;
    const val = _mapViewMode === 'amount' ? d.totalAmount : d.count;
    mapData.push({ name: en, value: val });
    if (val > maxVal) maxVal = val;
  });

  // 无数据国家填0
  Object.keys(_EC_NAME_MAP).forEach(en => {
    if (!mapData.find(d => d.name === en)) {
      mapData.push({ name: en, value: 0 });
    }
  });

  const isDark = document.body.classList.contains('dark-mode');
  const textColor = isDark ? '#FFFFFF' : '#1D1D1F';
  const borderColor = isDark ? '#3A3A3C' : '#FFFFFF';

  _mapChart.setOption({
    backgroundColor: 'transparent',
    tooltip: {
      trigger: 'item',
      backgroundColor: 'rgba(29,29,31,0.92)',
      borderColor: 'transparent',
      borderRadius: 12,
      padding: [10, 14],
      textStyle: { color: '#fff', fontSize: 12 },
      formatter: function(p) {
        const cn = _EC_NAME_MAP[p.name] || p.name;
        const val = p.value || 0;
        return '<div style="font-weight:600;font-size:13px;margin-bottom:3px">'+cn+'</div>'
          + '<div style="font-size:10px;opacity:0.8">' + (_mapViewMode === 'amount' ? '订单总额' : '客户数') + ': <b>'+val+'</b></div>';
      }
    },
    visualMap: {
      min: 0, max: maxVal, left: 'left', bottom: 10, calculable: false, show: false,
      inRange: { color: ['#F2F2F7','#E3F2FD','#90CAF9','#42A5F5','#1E88E5','#0D47A1'] }
    },
    series: [{
      name: '客户分布', type: 'map', map: 'world', roam: true,
      scaleLimit: { min: 1, max: 20 }, zoom: 1.2, center: [15, 25],
      label: { show: true, fontSize: 7, color: textColor, fontFamily: '-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif', formatter: function(p) { return _EC_NAME_MAP[p.name] || p.name; } },
      emphasis: {
        label: { show: true, fontSize: 11, fontWeight: 'bold' },
        itemStyle: { areaColor: '#1E88E5', borderColor: '#007AFF', borderWidth: 2 }
      },
      select: {
        label: { show: true, fontWeight: 'bold' },
        itemStyle: { areaColor: '#0D47A1', borderColor: '#007AFF', borderWidth: 2 }
      },
      itemStyle: { borderColor: borderColor, borderWidth: 1, borderType: 'solid', areaColor: '#F2F2F7' },
      data: mapData
    }]
  }, true);
}

// ==================== 国家选择 ====================
function _selectCountry(cn) {
  // 侧边栏高亮
  document.querySelectorAll('.map-country-item').forEach(el => el.classList.remove('active'));
  const item = document.querySelector('.map-country-item[data-country="'+cn+'"]');
  if (item) { item.classList.add('active'); item.scrollIntoView({ behavior:'smooth', block:'center' }); }

  // ECharts 高亮
  if (_mapChart) {
    const en = _EC_NAME_REV[cn] || cn;
    _mapChart.dispatchAction({ type: 'highlight', seriesName: '客户分布', name: en });
    _mapChart.dispatchAction({ type: 'showTip', seriesIndex: 0, name: en });
  }

  // 搜索框填入国家名
  const searchEl = document.getElementById('map-search-input');
  if (searchEl) searchEl.value = cn;
  _mapApplyFilters();
}

// ==================== 统计卡片视图切换 ====================
function _switchMapView(mode) {
  _mapViewMode = mode;
  _updateStatActive();
  const customers = _getFilteredCustomers();
  const countryMap = _buildCountryMap(customers);
  if (_mapChart) _updateEchartsOption(customers, countryMap);
}

function _updateStatActive() {
  ['total','countries','monthly','avg'].forEach((id, i) => {
    const modes = ['count','count','amount','growth'];
    const el = document.getElementById('map-stat-'+id);
    if (el) el.classList.toggle('active', _mapViewMode === modes[i]);
  });
}

// ==================== 缩放控制 ====================
function _mapZoomIn() {
  if (!_mapChart) return;
  const opt = _mapChart.getOption();
  const zoom = (opt.series && opt.series[0] && opt.series[0].zoom) || 1.2;
  _mapChart.setOption({ series: [{ zoom: Math.min(zoom * 1.3, 20) }] });
}
function _mapZoomOut() {
  if (!_mapChart) return;
  const opt = _mapChart.getOption();
  const zoom = (opt.series && opt.series[0] && opt.series[0].zoom) || 1.2;
  _mapChart.setOption({ series: [{ zoom: Math.max(zoom / 1.3, 1) }] });
}
function _mapZoomReset() {
  if (_mapChart) {
    _mapChart.dispatchAction({ type: 'restore' });
    _mapChart.setOption({ series: [{ zoom: 1.2, center: [15, 25] }] });
  }
}

// ==================== 筛选控制 ====================
function _mapApplyFilters() {
  const customers = _getFilteredCustomers();
  const countryMap = _buildCountryMap(customers);
  _renderCountryPanel(countryMap, customers);
  _renderMapTable(customers);
  if (_mapChart) _updateEchartsOption(customers, countryMap);
}

function _mapResetFilters() {
  const timeEl = document.getElementById('map-time-filter');
  const statusEl = document.getElementById('map-status-filter');
  const searchEl = document.getElementById('map-search-input');
  if (timeEl) timeEl.value = 'all';
  if (statusEl) statusEl.value = 'all';
  if (searchEl) searchEl.value = '';
  _mapApplyFilters();
}

// ==================== 国家排名面板 ====================
function _renderCountryPanel(countryMap, customers) {
  const panel = document.getElementById('map-country-panel');
  if (!panel) return;
  const entries = Object.entries(countryMap).sort((a, b) => b[1].count - a[1].count);
  const maxCount = entries.length > 0 ? entries[0][1].count : 1;

  panel.innerHTML = `
    <div class="map-country-header">
      <span class="map-country-title">国家分布</span>
      <span class="map-country-count">${entries.length} 个国家</span>
    </div>
    <div class="map-country-list">
      ${entries.map(([cn, d], i) => {
        const badge = i===0 ? '<span class="map-hot-label t1">TOP1</span>' :
                       i===1 ? '<span class="map-hot-label t2">TOP2</span>' :
                       i===2 ? '<span class="map-hot-label t3">TOP3</span>' : '';
        const flag = _getFlag(cn);
        return '<div class="map-country-item" data-country="'+Utils.escapeHtml(cn)+'" onclick="_selectCountry(\''+Utils.escapeHtml(cn)+'\')">'
          + '<div class="map-country-flag">'+flag+'</div>'
          + '<div class="map-country-name">'+Utils.escapeHtml(cn)+'</div>'
          + badge
          + '<div class="map-country-bar"><div class="map-country-bar-fill" style="width:'+(d.count/maxCount*100).toFixed(0)+'%"></div></div>'
          + '<div class="map-country-num">'+d.count+'</div></div>';
      }).join('')}
    </div>
  `;
}

// ==================== 数据表格 ====================
let _tableSort = { col: null, asc: true }, _tablePage = 1;
const _TABLE_PAGE_SIZE = 20;

function _renderMapTable(customers) {
  const wrap = document.getElementById('map-table-wrap');
  if (!wrap) return;

  const searchQuery = (document.getElementById('map-table-search-input')?.value || '').trim().toLowerCase();
  let filtered = customers;
  if (searchQuery) {
    filtered = customers.filter(c =>
      (c.name||'').toLowerCase().includes(searchQuery) ||
      (c.country||'').toLowerCase().includes(searchQuery) ||
      (c.city||'').toLowerCase().includes(searchQuery)
    );
  }

  if (_tableSort.col) {
    filtered = [...filtered].sort((a,b) => {
      const va = a[_tableSort.col] || '', vb = b[_tableSort.col] || '';
      const cmp = typeof va === 'number' ? va - vb : String(va).localeCompare(String(vb), 'zh-CN');
      return _tableSort.asc ? cmp : -cmp;
    });
  }

  const totalPages = Math.ceil(filtered.length / _TABLE_PAGE_SIZE) || 1;
  if (_tablePage > totalPages) _tablePage = totalPages;
  const start = (_tablePage - 1) * _TABLE_PAGE_SIZE;
  const page = filtered.slice(start, start + _TABLE_PAGE_SIZE);

  const cols = [
    { key:'name', label:'客户名称' }, { key:'country', label:'国家/地区' },
    { key:'city', label:'城市' }, { key:'contact', label:'联系人' },
    { key:'stage', label:'阶段' }, { key:'source', label:'来源' }, { key:'createdAt', label:'创建日期' }
  ];

  const headerHtml = cols.map(c => {
    const sorted = _tableSort.col === c.key;
    return '<th class="'+ (sorted ? 'sorted' : '') +'" onclick="_mapSortTable(\''+c.key+'\')">'
      + c.label + (sorted ? '<span class="sort-arrow">'+(_tableSort.asc?'▲':'▼')+'</span>' : '') + '</th>';
  }).join('');

  const bodyHtml = page.length > 0 ? page.map(c => {
    const stageClass = (c.stage==='潜在客户'?'potential':c.stage==='意向明确'?'interested':c.stage==='报价中'?'quoting':c.stage==='谈判中'?'negotiating':c.stage==='样品确认'?'sample':c.stage==='已成交'?'closed':c.stage==='已流失'?'lost':'potential');
    const flag = _getFlag(c.country);
    return '<tr onclick="_selectCountry(\''+Utils.escapeHtml(c.country)+'\')">'
      + '<td>'+Utils.escapeHtml(c.name)+'</td>'
      + '<td>'+flag+' '+Utils.escapeHtml(c.country)+'</td>'
      + '<td>'+Utils.escapeHtml(c.city)+'</td>'
      + '<td>'+Utils.escapeHtml(c.contact)+'</td>'
      + '<td><span class="stage-tag '+stageClass+'">'+Utils.escapeHtml(c.stage)+'</span></td>'
      + '<td>'+Utils.escapeHtml(c.source)+'</td>'
      + '<td>'+Utils.escapeHtml(c.createdAt)+'</td></tr>';
  }).join('') : '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-secondary);">没有找到匹配的客户</td></tr>';

  const pagHtml = totalPages > 1 ? `
    <div class="map-pagination">
      <button class="map-page-btn" onclick="_mapGoPage('+(_tablePage-1)+')" '+(_tablePage===1?'disabled':'')+'>‹</button>
      ${(()=>{let h='';for(let p=1;p<=Math.min(totalPages,7);p++)h+='<button class="map-page-btn '+(p===_tablePage?'active':'')+'" onclick="_mapGoPage('+p+')">'+p+'</button>';return h;})()}
      <span class="map-page-info">${_tablePage}/${totalPages} 页</span>
      <button class="map-page-btn" onclick="_mapGoPage('+(_tablePage+1)+')" '+(_tablePage===totalPages?'disabled':'')+'>›</button>
    </div>` : '';

  wrap.innerHTML = `
    <div class="map-data-table-header">
      <span class="map-data-table-title">客户详情 (${filtered.length})</span>
      <input type="text" class="map-data-table-search" id="map-table-search-input" placeholder="搜索..." oninput="_tablePage=1;_renderMapTable(_getFilteredCustomers())">
    </div>
    <div style="overflow-x:auto;">
      <table class="map-data-table"><thead><tr>${headerHtml}</tr></thead><tbody>${bodyHtml}</tbody></table>
    </div>
    ${pagHtml}
  `;
}

function _mapSortTable(col) {
  if (_tableSort.col === col) { _tableSort.asc = !_tableSort.asc; }
  else { _tableSort.col = col; _tableSort.asc = true; }
  _tablePage = 1;
  _renderMapTable(_getFilteredCustomers());
}

function _mapGoPage(p) {
  const filtered = _getFilteredCustomers();
  const totalPages = Math.ceil(filtered.length / _TABLE_PAGE_SIZE) || 1;
  if (p >= 1 && p <= totalPages) { _tablePage = p; _renderMapTable(filtered); }
}

// ==================== Export ====================

  const customers = _getFilteredCustomers();
  const countryMap = _buildCountryMap(customers);
  const cl = Object.entries(countryMap).sort((a, b) => b[1].count - a[1].count);
  const xls = '<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'
    + '<Styles><Style ss:ID="h"><Font ss:FontName="PingFang SC" ss:Bold="1"/><Interior ss:Color="#F2F2F7"/></Style></Styles>'
    + '<Worksheet ss:Name="客户分布汇总"><Table>'
    + '<Row><Cell ss:StyleID="h"><Data ss:Type="String">序号</Data></Cell><Cell ss:StyleID="h"><Data ss:Type="String">国家/地区</Data></Cell><Cell ss:StyleID="h"><Data ss:Type="String">客户数量</Data></Cell><Cell ss:StyleID="h"><Data ss:Type="String">占比</Data></Cell></Row>'
    + cl.map(([cn, d], i) => '<Row><Cell><Data ss:Type="Number">' + (i + 1) + '</Data></Cell><Cell><Data ss:Type="String">' + cn + '</Data></Cell><Cell><Data ss:Type="Number">' + d.count + '</Data></Cell><Cell><Data ss:Type="String">' + (d.count / customers.length * 100).toFixed(1) + '%</Data></Cell></Row>').join('')
    + '</Table></Worksheet>'
    + '<Worksheet ss:Name="客户明细"><Table>'
    + '<Row><Cell ss:StyleID="h"><Data ss:Type="String">序号</Data></Cell><Cell ss:StyleID="h"><Data ss:Type="String">客户名称</Data></Cell><Cell ss:StyleID="h"><Data ss:Type="String">国家</Data></Cell><Cell ss:StyleID="h"><Data ss:Type="String">城市</Data></Cell><Cell ss:StyleID="h"><Data ss:Type="String">联系人</Data></Cell><Cell ss:StyleID="h"><Data ss:Type="String">阶段</Data></Cell><Cell ss:StyleID="h"><Data ss:Type="String">来源</Data></Cell><Cell ss:StyleID="h"><Data ss:Type="String">创建日期</Data></Cell></Row>'
    + customers.map((c, i) => '<Row><Cell><Data ss:Type="Number">' + (i + 1) + '</Data></Cell><Cell><Data ss:Type="String">' + (c.name || '') + '</Data></Cell><Cell><Data ss:Type="String">' + (c.country || '') + '</Data></Cell><Cell><Data ss:Type="String">' + (c.city || '') + '</Data></Cell><Cell><Data ss:Type="String">' + (c.contact || '') + '</Data></Cell><Cell><Data ss:Type="String">' + (c.stage || '') + '</Data></Cell><Cell><Data ss:Type="String">' + (c.source || '') + '</Data></Cell><Cell><Data ss:Type="String">' + (c.createdAt || '') + '</Data></Cell></Row>').join('')
    + '</Table></Worksheet></Workbook>';
  const blob = new Blob([xls], { type: 'application/vnd.ms-excel' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '客户地图分布_' + new Date().toISOString().split('T')[0] + '.xls';
  a.click();
  URL.revokeObjectURL(url);
  Utils.toast('✅ 地图数据已导出');
};

// ==================== 暗色模式适配 ECharts ====================
(function() {
  const origToggleDark = window.toggleDarkMode;
  window.toggleDarkMode = function() {
    if (origToggleDark) origToggleDark();
    if (_mapChart) {
      const customers = _getFilteredCustomers();
      const countryMap = _buildCountryMap(customers);
      _updateEchartsOption(customers, countryMap);
    }
  };
})();
